<!doctype html><html><head><meta charset="utf-8"><title>Open Founder</title>

<body><div class="c"><h2>Connect to your Open Founder server</h2><p>Couldn't reach the server. Start one with<br><code>curl -fsSL https://codesbyfebin.github.io/Open-Founder/install.sh | sh</code><br>or enter your server URL:</p>
